name: VelociTrack F1 — AWS ECS Production Deployment (On-Demand)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Deployment Environment"
        required: true
        type: choice
        options:
          - "production"
          - "demo"
        default: "production"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 🔍 Lint, Validate & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Strict Typecheck & Build Validation
        working-directory: frontend
        run: npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend Syntax & Schema Compilation
        working-directory: backend
        run: |
          python -m py_compile app/main.py app/services/interpolator.py app/models/schemas.py app/services/fastf1_client.py

  deploy-aws:
    name: 🚀 Build, Push & Deploy to AWS ECS Fargate
    needs: validate
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Configure Remote Terraform State (S3)
        id: tf-state
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          STATE_BUCKET="velocitrack-f1-tfstate-${ACCOUNT_ID}-${{ env.AWS_REGION }}"
          echo "state_bucket=${STATE_BUCKET}" >> $GITHUB_OUTPUT

          echo "Checking Terraform S3 state bucket: ${STATE_BUCKET}..."
          if ! aws s3api head-bucket --bucket "${STATE_BUCKET}" 2>/dev/null; then
            echo "State bucket does not exist. Creating ${STATE_BUCKET}..."
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${{ env.AWS_REGION }}"
            else
              aws s3api create-bucket --bucket "${STATE_BUCKET}" --region "${{ env.AWS_REGION }}" \
                --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            fi
            aws s3api put-bucket-versioning --bucket "${STATE_BUCKET}" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "${STATE_BUCKET}" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          printf 'terraform {\n  backend "s3" {\n    bucket = "%s"\n    key    = "terraform.tfstate"\n    region = "%s"\n  }\n}\n' "${STATE_BUCKET}" "${{ env.AWS_REGION }}" > infra/terraform/backend.tf
          echo "✅ Remote S3 backend configuration generated."

      - name: Terraform Init & ECR Bootstrap
        working-directory: infra/terraform
        run: |
          terraform init -upgrade
          echo "Bootstrapping ECR repositories to receive Docker images..."
          terraform apply \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.frontend \
            -auto-approve

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR Endpoints
        id: ecr-endpoints
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          echo "ecr_backend=${REGISTRY}/velocitrack-f1-backend" >> $GITHUB_OUTPUT
          echo "ecr_frontend=${REGISTRY}/velocitrack-f1-frontend" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-endpoints.outputs.ecr_backend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: ${{ steps.ecr-endpoints.outputs.ecr_frontend }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Terraform Full Infrastructure Apply
        id: tf-apply
        working-directory: infra/terraform
        run: |
          echo "Applying full Terraform infrastructure (VPC, Subnets, ALB, ECS)..."
          terraform apply -auto-approve
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> $GITHUB_OUTPUT

      - name: Trigger Rolling ECS Service Deployment
        run: |
          echo "Triggering zero-downtime rolling update on ECS..."
          aws ecs update-service \
            --cluster velocitrack-f1-cluster \
            --service velocitrack-f1-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS Service Steady State & Health Probes
        run: |
          ALB_URL="http://${{ steps.tf-apply.outputs.alb_dns }}"
          echo "Awaiting ALB Target Group and Container health checks at ${ALB_URL}/health..."
          MAX_ATTEMPTS=30
          ATTEMPT=1
          IS_HEALTHY=false

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${ALB_URL}/health" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              IS_HEALTHY=true
              echo "✅ Health probe passed with HTTP 200 on attempt ${ATTEMPT}!"
              break
            fi
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: Health probe returned HTTP ${STATUS_CODE}. Retrying in 10s..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$IS_HEALTHY" != true ]; then
            echo "❌ Health check timed out after 300s. Inspecting ECS service events..."
            aws ecs describe-services --cluster velocitrack-f1-cluster --services velocitrack-f1-service --region ${{ env.AWS_REGION }} --query "services[0].events[0:5]"
            exit 1
          fi

      - name: Execute Live Smoke Verification
        run: |
          ALB_URL="http://${{ steps.tf-apply.outputs.alb_dns }}"
          echo "Verifying live ALB endpoints at $ALB_URL..."
          
          # Root endpoint check
          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/")
          echo "Root Endpoint HTTP Status: $ROOT_STATUS"
          [ "$ROOT_STATUS" -eq 200 ] || exit 1

          # Health probe check
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/health")
          echo "Health Endpoint HTTP Status: $HEALTH_STATUS"
          [ "$HEALTH_STATUS" -eq 200 ] || exit 1

          # Demo telemetry API check
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/api/telemetry/demo?sampling_rate=10&laps=2")
          echo "Demo API HTTP Status: $API_STATUS"
          [ "$API_STATUS" -eq 200 ] || exit 1

          echo "🎉 All production smoke tests passed successfully!"

      - name: Output Deployment Summary
        run: |
          echo "### 🏎️ VelociTrack F1 — Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Application URL:** [http://${{ steps.tf-apply.outputs.alb_dns }}](http://${{ steps.tf-apply.outputs.alb_dns }})" >> $GITHUB_STEP_SUMMARY
          echo "- **FastAPI Health Probe:** [http://${{ steps.tf-apply.outputs.alb_dns }}/health](http://${{ steps.tf-apply.outputs.alb_dns }}/health)" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compute Engine:** AWS ECS on AWS Fargate (Serverless \`linux/amd64\`)" >> $GITHUB_STEP_SUMMARY


