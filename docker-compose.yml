services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velocitrack-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FASTF1_CACHE_DIR=/app/.fastf1_cache
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DEFAULT_SAMPLING_RATE=10
    volumes:
      - fastf1_cache:/app/.fastf1_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: velocitrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fastf1_cache:
    driver: local
